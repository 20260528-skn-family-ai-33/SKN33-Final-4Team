{# 팝업: 어떤 카테고리인가요? (카테고리 확인 필요 거래). 고르면 닫힌다 · 저장은 안 됨 #}
{% load money %}
<button type="button" class="mc-backdrop" aria-label="닫기"></button>
<section class="mc-sheet" role="dialog" aria-modal="true" aria-label="카테고리 고르기">
  <div class="mc-handle"></div>
  <div class="mc-row"><span></span><button type="button" class="mc-link" data-close>닫기 ×</button></div>
  <h2>어떤 카테고리인가요?</h2>
  <p class="mc-muted" style="margin:4px 0 12px">{{ tx.name }} · {{ tx.amount|won }}</p>
  <div class="mc-lock-list">
    {% for cat in categories %}
    <button type="button" class="mc-lock-opt" data-close><span class="mc-grow">{{ cat }}</span></button>
    {% endfor %}
  </div>
</section>
